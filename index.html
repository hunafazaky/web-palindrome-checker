<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main>
      <h1 id="main-title">Palindrome Checker</h1>
      <article id="main-card">
        <section class="input-box">
          <input id="text-input" type="text" placeholder="Type a word or phrase..." />
          <button id="check-btn">Check</button>
        </section>
        <section class="output-box">
          <p id="result">The result will be displayed here...</p>
        </section>
      </article>
    </main>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
